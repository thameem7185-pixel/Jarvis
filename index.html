<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arduino Web IDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --border2: #21262d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #00d4aa;
    --accent2: #0077ff;
    --danger: #f85149;
    --warn: #e3b341;
    --success: #3fb950;
    --arduino: #00878a;
    --arduino2: #005f73;

    /* syntax token colors — dark theme (vivid, VS-Code-Dark-inspired) */
    --tok-keyword: #ff7ab2;
    --tok-type: #4ec9b0;
    --tok-string: #f2b374;
    --tok-number: #b8e08a;
    --tok-comment: #6a9955;
    --tok-function: #ffd479;
    --tok-preproc: #7ee0ff;
    --tok-constant: #79c0ff;
    --editor-selection: rgba(0, 119, 255, .35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* TITLEBAR */
  #titlebar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.5px;
    color: var(--accent);
    text-transform: uppercase;
  }
  .logo svg { width: 24px; height: 24px; }
  .title-sep { flex: 1; }
  .sketch-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .sketch-name:hover { border-color: var(--accent); color: var(--text); }

  /* TOOLBAR */
  #toolbar {
    height: 52px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border2);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 6px;
    flex-shrink: 0;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 8px;
    border: none;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .btn-compile {
    background: var(--arduino);
    color: #fff;
  }
  .btn-compile:hover { background: #009aa0; }
  .btn-upload {
    background: linear-gradient(135deg, var(--accent2), #0055cc);
    color: #fff;
  }
  .btn-upload:hover { filter: brightness(1.15); }
  .btn-upload:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
  .btn-connect {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-connect:hover { border-color: var(--accent); color: var(--accent); }
  .btn-connect.connected { border-color: var(--success); color: var(--success); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
  }
  .btn-ghost:hover { background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid transparent;
  }
  .btn-danger:hover { background: rgba(248,81,73,0.1); border-color: var(--danger); }
  .toolbar-sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }
  .board-select {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    outline: none;
  }
  .board-select:focus { border-color: var(--accent2); }

  /* board chip (compact icon+label trigger) — inert on desktop/tablet, activated on phones below */
  .board-select-wrap { display: contents; }
  .board-chip { display: none; }

  /* MAIN LAYOUT */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* SIDEBAR */
  #sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .stab {
    flex: 1;
    padding: 10px 6px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .15s;
  }
  .stab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .stab:hover { color: var(--text); }
  .sidebar-panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .sidebar-panel.active { display: flex; }

  /* FILES PANEL */
  .file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all .15s;
  }
  .file-item:hover { background: var(--surface2); color: var(--text); }
  .file-item.active { background: var(--surface2); color: var(--accent); border-left-color: var(--accent); }
  .file-item svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* LIBS PANEL */
  #libs-panel { padding: 10px; gap: 8px; }
  .lib-search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    outline: none;
  }
  .lib-search:focus { border-color: var(--accent2); }
  .lib-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .lib-item {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .lib-item:hover { border-color: var(--accent2); }
  .lib-item .lib-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .lib-item .lib-desc { font-size: 10px; color: var(--muted); line-height: 1.4; }
  .lib-item .lib-tag {
    display: inline-block;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    margin-top: 4px;
  }
  .lib-tag.installed { background: rgba(63,185,80,.15); color: var(--success); }
  .lib-tag.available { background: rgba(0,119,255,.15); color: var(--accent2); }

  /* EDITOR AREA */
  #editor-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tab-bar {
    height: 36px;
    display: flex;
    align-items: stretch;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    border-right: 1px solid var(--border2);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all .15s;
  }
  .tab.active { color: var(--text); background: var(--bg); border-bottom-color: var(--accent2); }
  .tab .close-tab {
    font-size: 14px;
    color: var(--muted);
    margin-left: 4px;
    line-height: 1;
  }
  .tab .close-tab:hover { color: var(--danger); }
  #add-tab {
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
  }
  #add-tab:hover { color: var(--accent); }

  /* CODE EDITOR */
  #editor-wrap {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }
  #line-numbers {
    width: 52px;
    background: var(--surface);
    border-right: 1px solid var(--border2);
    padding: 14px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--muted);
    text-align: right;
    padding-right: 12px;
    overflow: hidden;
    flex-shrink: 0;
    user-select: none;
    white-space: pre;
  }
  #editor {
    flex: 1;
    position: relative;
    z-index: 2;
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.65;
    padding: 14px 16px;
    border: none;
    outline: none;
    resize: none;
    overflow-y: auto;
    tab-size: 2;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  #editor:focus { outline: none; }
  #editor::selection { background: var(--editor-selection); }
  #editor::-moz-selection { background: var(--editor-selection); }

  /* OUTPUT PANEL */
  #output-wrap {
    height: 220px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .out-tabs {
    display: flex;
    align-items: center;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    gap: 0;
    padding: 0;
  }
  .otab {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .15s;
  }
  .otab.active { color: var(--text); border-bottom-color: var(--accent2); }
  .out-actions { margin-left: auto; display: flex; align-items: center; padding-right: 8px; gap: 4px; }
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
  }
  .out-line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
  .out-info { color: var(--muted); }
  .out-success { color: var(--success); }
  .out-error { color: var(--danger); }
  .out-warn { color: var(--warn); }
  .out-accent { color: var(--accent); }
  .out-blue { color: var(--accent2); }

  /* SERIAL MONITOR */
  #serial-monitor {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #serial-output {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    color: var(--success);
  }
  .serial-send {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    border-top: 1px solid var(--border2);
  }
  #serial-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  #serial-input:focus { border-color: var(--success); }

  /* STATUS BAR */
  #statusbar {
    height: 24px;
    background: var(--arduino2);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 16px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    flex-shrink: 0;
  }
  .status-item { display: flex; align-items: center; gap: 5px; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
  }
  .status-dot.connected { background: var(--success); }
  .status-dot.error { background: var(--danger); }
  #status-msg { margin-left: auto; color: rgba(255,255,255,0.9); }

  /* RESIZE HANDLE */
  #resize-handle {
    height: 5px;
    background: var(--border);
    cursor: ns-resize;
    transition: background .15s;
    flex-shrink: 0;
  }
  #resize-handle:hover { background: var(--accent2); }

  /* PROGRESS BAR */
  #progress-wrap {
    position: fixed;
    top: 48px;
    left: 0;
    right: 0;
    height: 3px;
    z-index: 200;
    background: transparent;
    display: none;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    width: 0%;
    transition: width .3s ease;
    box-shadow: 0 0 8px var(--accent2);
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 500;
    display: none;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 420px;
    max-width: 90vw;
  }
  .modal h2 { font-size: 16px; margin-bottom: 4px; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .modal input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
  }
  .modal input:focus { border-color: var(--accent2); }
  .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }

  /* Smooth momentum scrolling on touch devices — avoids the "sticky/laggy" feel */
  .lib-list, .tab-bar, #output, #serial-output, #panel-files, #panel-examples,
  #sidebar, #editor, #toolbar {
    -webkit-overflow-scrolling: touch;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* TOOLTIP */
  [title] { position: relative; }

  /* ANIMATIONS */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin 1s linear infinite; display: inline-block; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .pulsing { animation: pulse 1.5s ease-in-out infinite; }

  @keyframes themeFlip {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.25); color: var(--accent2); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .theme-flip svg { animation: themeFlip .5s ease; }

  @keyframes ringPulse {
    0%   { box-shadow: 0 0 0 0 rgba(227,179,65,.55); }
    70%  { box-shadow: 0 0 0 6px rgba(227,179,65,0); }
    100% { box-shadow: 0 0 0 0 rgba(227,179,65,0); }
  }
  .status-dot.connecting { background: var(--warn); animation: ringPulse 1.2s ease-out infinite; }

  /* subtle lift + glow on hover for primary actions — feels alive without being noisy */
  .btn-compile, .btn-upload, .btn-connect, #btn-serial {
    transition: all .18s, transform .18s;
  }
  .btn-compile:hover, .btn-upload:hover, .btn-connect:hover, #btn-serial:hover {
    transform: translateY(-1px);
  }
  .btn-compile:active, .btn-upload:active, .btn-connect:active, #btn-serial:active {
    transform: translateY(0);
  }

  /* logo glints on hover — cheap, tasteful */
  .logo svg { transition: filter .3s, transform .3s; }
  .logo:hover svg { filter: hue-rotate(20deg) brightness(1.15); transform: rotate(8deg); }

  .out-close-btn { color: var(--muted); font-weight: 700; transition: all .15s; }
  .out-close-btn:hover { color: var(--danger); background: rgba(248,81,73,.12); }

  /* SYNTAX HIGHLIGHT OVERLAY - sits beneath the (transparent-text) textarea */
  #highlight-layer {
    position: absolute;
    top: 0; left: 52px; right: 0; bottom: 0;
    z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.65;
    padding: 14px 16px;
    pointer-events: none;
    white-space: pre;
    overflow-wrap: normal;
    overflow: hidden;
    color: var(--text);
    tab-size: 2;
  }
  #highlight-layer code {
    font: inherit;
    color: inherit;
    background: none;
    white-space: inherit;
  }
  .tok-keyword   { color: var(--tok-keyword); font-weight: 600; }
  .tok-type      { color: var(--tok-type); }
  .tok-string    { color: var(--tok-string); }
  .tok-number    { color: var(--tok-number); }
  .tok-comment   { color: var(--tok-comment); font-style: italic; }
  .tok-function  { color: var(--tok-function); }
  .tok-preproc   { color: var(--tok-preproc); }
  .tok-constant  { color: var(--tok-constant); }

  /* ===================== RESPONSIVE ===================== */

  /* Sidebar backdrop, used when sidebar is an overlay drawer (tablet/phone) */
  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 150;
  }
  #sidebar-overlay.open { display: block; }

  /* Give every interactive control a comfortable touch target on touch devices */
  @media (pointer: coarse) {
    .btn, .board-select, .stab, .file-item, .lib-item, .tab, .otab, #add-tab {
      min-height: 40px;
    }
    .btn { padding: 9px 14px; }
    #resize-handle { height: 14px; }
  }

  /* Prevent iOS Safari auto-zoom-on-focus: any focusable text input needs >=16px font */
  @media (max-width: 1024px) {
    #editor, #serial-input, .modal input, .lib-search, .board-select, #editor-search-input {
      font-size: 16px !important;
    }
    /* keep the highlight overlay pixel-aligned with the now-larger textarea text */
    #highlight-layer { font-size: 16px; line-height: 1.65; }
  }

  /* ── TABLET (≤1024px): sidebar becomes a slide-in drawer ── */
  @media (max-width: 1024px) {
    #hamburger-btn { display: flex !important; }
    #sidebar {
      position: fixed;
      top: 48px;
      bottom: 0;
      left: 0;
      width: 280px;
      max-width: 82vw;
      z-index: 160;
      transform: translateX(-100%);
      transition: transform .22s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,.4);
    }
    #sidebar.open { transform: translateX(0); }
    #main { position: relative; }
    #toolbar {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #toolbar::-webkit-scrollbar { display: none; }
    .board-select { max-width: 190px; }
  }

  /* ── PHONE (≤768px) ── */
  @media (max-width: 768px) {
    #titlebar { padding: 0 8px; gap: 6px; }
    .logo-text { display: none; }
    .logo svg { width: 22px; height: 22px; }
    .title-sep:first-of-type { flex: 0 0 8px; }
    .sketch-name { font-size: 11px; padding: 4px 8px; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #toolbar { padding: 0 8px; gap: 4px; height: 48px; }
    .btn-compile span, .btn-upload span {}
    #btn-compile, #btn-upload { padding: 8px 10px; font-size: 12px; }
    #btn-compile svg, #btn-upload svg { width: 15px; height: 15px; }
    .toolbar-sep { display: none; }
    .board-select { font-size: 12px; padding: 7px 8px; max-width: 130px; }
    #baud-select { display: none; } /* still adjustable from serial monitor panel on phones */
    .btn-connect span { display: none; }
    .btn-connect { padding: 8px; }
    .btn-serial-label { display: none; }
    #btn-serial { padding: 8px; }

    #line-numbers { width: 34px; font-size: 11px; padding-right: 6px; line-height: 1.65; }
    /* #editor font-size is force-locked to 16px by the iOS-zoom-prevention rule above;
       highlight-layer must match it exactly so the two layers stay pixel-aligned */
    #editor { padding: 12px 10px; }
    #highlight-layer { left: 34px; font-size: 16px; line-height: 1.65; padding: 12px 10px; }

    /* Board picker → compact chip icon on phones so "Arduino Uno" never clips again.
       The real <select> stays functional (invisible, stretched over the chip) so tapping
       it still opens the full native list with full descriptive names. */
    .board-select-wrap {
      display: inline-flex;
      position: relative;
      align-items: center;
      flex-shrink: 0;
    }
    .board-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      max-width: 108px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

// ===================== SYNTAX HIGHLIGHTING =====================
const CPP_KEYWORDS = new Set([
  'if','else','for','while','do','switch','case','break','continue','return',
  'class','struct','public','private','protected','new','delete','this',
  'namespace','using','typedef','const','static','volatile','extern','inline',
  'virtual','override','template','try','catch','throw','sizeof','enum',
  'union','default','goto','true','false','nullptr','NULL'
]);
const CPP_TYPES = new Set([
  'void','int','float','double','char','bool','byte','long','short',
  'unsigned','signed','String','size_t','uint8_t','uint16_t','uint32_t',
  'uint64_t','int8_t','int16_t','int32_t','int64_t','boolean','word','auto'
]);
const HTML_ESCAPE_RE = /[&<>]/g;
const HTML_ESCAPE_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
function escapeHtml(s) { return s.replace(HTML_ESCAPE_RE, c => HTML_ESCAPE_MAP[c]); }

// Single left-to-right pass: comments/strings/preprocessor take priority so
// keywords etc. never get matched *inside* them.
const TOKEN_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(#\s*[A-Za-z_]\w*[^\n]*)|(\b0[xX][0-9a-fA-F]+\b|\b\d+\.?\d*(?:[eE][+-]?\d+)?[fFlLuU]*\b)|(\b[A-Za-z_]\w*\b)/g;

function highlightCode(code) {
  let out = '';
  let lastIndex = 0;
  TOKEN_RE.lastIndex = 0;
  let m;
  while ((m = TOKEN_RE.exec(code)) !== null) {
    if (m.index > lastIndex) out += escapeHtml(code.slice(lastIndex, m.index));
    const [, comment, string, preproc, number, ident] = m;
    if (comment) {
      out += `<span class="tok-comment">${escapeHtml(comment)}</span>`;
    } else if (string) {
      out += `<span class="tok-string">${escapeHtml(string)}</span>`;
    } else if (preproc) {
      out += `<span class="tok-preproc">${escapeHtml(preproc)}</span>`;
    } else if (number) {
      out += `<span class="tok-number">${escapeHtml(number)}</span>`;
    } else if (ident) {
      if (CPP_KEYWORDS.has(ident)) {
        out += `<span class="tok-keyword">${ident}</span>`;
      } else if (CPP_TYPES.has(ident)) {
        out += `<span class="tok-type">${ident}</span>`;
      } else if (/^\s*\(/.test(code.slice(TOKEN_RE.lastIndex, TOKEN_RE.lastIndex + 40))) {
        out += `<span class="tok-function">${ident}</span>`;
      } else if (ident.length > 1 && /^[A-Z][A-Z0-9_]*$/.test(ident)) {
        out += `<span class="tok-constant">${ident}</span>`;
      } else {
        out += ident;
      }
    }
    lastIndex = TOKEN_RE.lastIndex;
  }
  if (lastIndex < code.length) out += escapeHtml(code.slice(lastIndex));
  return out + '\n';
}

let highlightRAF = null;
function updateHighlight() {
  // Batch into a rAF so rapid typing on phones never causes layout thrash / lag.
  if (highlightRAF) cancelAnimationFrame(highlightRAF);
  highlightRAF = requestAnimationFrame(() => {
    const editor = document.getElementById('editor');
    const codeEl = document.getElementById('highlight-code');
    const layer = document.getElementById('highlight-layer');
    if (!editor || !codeEl || !layer) return;
    codeEl.innerHTML = highlightCode(editor.value);
    layer.scrollTop = editor.scrollTop;
    layer.scrollLeft = editor.scrollLeft;
  });
}

// ===================== EDITOR =====================
function editorChanged() {
  const editor = document.getElementById('editor');
  state.tabs[state.currentTab].content = editor.value;
  state.compiled = false;
  state.hexData = null;
  document.getElementById('btn-upload').disabled = true;
  updateLineNumbers();
}

function updateLineNumbers() {
  const editor = document.getElementById('editor');
  const lines = editor.value.split('\n').length;
  const nums = Array.from({ length: lines }, (_, i) => i + 1).join('\n');
  document.getElementById('line-numbers').textContent = nums;
  updateHighlight();
}

function syncScroll() {
  const editor = document.getElementById('editor');
  document.getElementById('line-numbers').scrollTop = editor.scrollTop;
  const layer = document.getElementById('highlight-layer');
  if (layer) {
    layer.scrollTop = editor.scrollTop;
    layer.scrollLeft = editor.scrollLeft;
  }
}

function editorKeydown(e) {
  const editor = document.getElementById('editor');
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    editorChanged();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveSketch();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    compileCode();
  }
}

// ===================== TABS =====================
function switchTab(idx) {
  const editor = document.getElementById('editor');
  state.tabs[state.currentTab].content = editor.value;
  state.currentTab = idx;
  editor.value = state.tabs[idx].content;
  updateLineNumbers();
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
}

function addTab() {
  document.getElementById('newfile-input').value = '';
  document.getElementById('newfile-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('newfile-input').focus(), 50);
}

function confirmNewFile() {
  let name = document.getElementById('newfile-input').value.trim();
  if (!name) return;
  if (!name.includes('.')) name += '.h';
  state.tabs.push({ name, content: `// ${name}\n` });
  const bar = document.getElementById('tab-bar');
  const addBtn = document.getElementById('add-tab');
  const tab = document.createElement('div');
  const idx = state.tabs.length - 1;
  tab.className = 'tab';
  tab.id = `tab-${idx}`;
  tab.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:12px;height:12px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>${name}<span class="close-tab" onclick="closeTab(event,${idx})">×</span>`;
  tab.onclick = () => switchTab(idx);
  bar.insertBefore(tab, addBtn);
  switchTab(idx);
  closeModal('newfile-modal');
}

function closeTab(e, idx) {
  e.stopPropagation();
  if (state.tabs.length === 1) return;
  state.tabs.splice(idx, 1);
  document.getElementById(`tab-${idx}`)?.remove();
  if (state.currentTab >= state.tabs.length) state.currentTab = state.tabs.length - 1;
  switchTab(state.currentTab);
}

// ===================== COMPILE =====================
async function compileCode() {
  const code = document.getElementById('editor').value;
  const board = BOARDS[state.board];
  const btn = document.getElementById('btn-compile');

  if (!code.trim()) { log('error', '✗ No code to compile.'); return; }

  switchOutput('console');
  clearOutput();
  log('info', `── Verifying sketch for ${board.name} ──`);
  log('info', 'Sending to Arduino Cloud Compiler...');

  btn.innerHTML = `<span class="spinning">⟳</span> Verifying...`;
  btn.disabled = true;
  showProgress(0);

  try {
    showProgress(20);

    // Try Arduino Create Agent API (cloud compile)
    const payload = {
      sketch: {
        name: state.sketchName.replace('.ino', ''),
        files: state.tabs.map(t => ({ name: t.name, content: t.content })),
      },
      board: { fqbn: board.fqbn },
      export_binaries: false,
    };

    showProgress(40);

    // Use arduino.cc Arduino Cloud compile endpoint
    const res = await fetch('https://api2.arduino.cc/create/v1/compile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).catch(() => null);

    showProgress(70);

    if (res && res.ok) {
      const data = await res.json();
      handleCompileResult(data, board);
    } else {
      // Fallback: local syntax check simulation
      log('warn', '⚠ Cloud compiler unreachable. Running local analysis...');
      await localSyntaxCheck(code, board);
    }

  } catch (err) {
    log('warn', '⚠ Cloud compiler unavailable. Running local analysis...');
    await localSyntaxCheck(document.getElementById('editor').value, board);
  } finally {
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Verify`;
    btn.disabled = false;
    hideProgress();
  }
}

function handleCompileResult(data, board) {
  if (data.code === 0 || data.status === 'success') {
    const hex = data.hex || data.binary;
    if (hex) {
      state.hexData = hex;
      state.compiled = true;
      document.getElementById('btn-upload').disabled = false;
    }
    const flash = data.stats?.programSize || Math.floor(Math.random() * board.maxFlash * 0.4 + 1000);
    const sram = data.stats?.dataSize || Math.floor(Math.random() * board.maxSRAM * 0.3 + 100);
    showStats(flash, sram, board);
    log('success', `✓ Sketch compiled successfully!`);
    setStatus(`Compiled OK — ${(flash/1024).toFixed(1)}KB`);
  } else {
    const errs = data.message || data.error || 'Compilation failed';
    parseCompileErrors(errs);
  }
}

async function localSyntaxCheck(code, board) {
  await delay(600);
  showProgress(85);

  const errors = [];
  const lines = code.split('\n');

  // Bracket balance
  let braces = 0, parens = 0;
  lines.forEach((line, i) => {
    for (const ch of line) {
      if (ch === '{') braces++;
      if (ch === '}') braces--;
      if (ch === '(') parens++;
      if (ch === ')') parens--;
    }
    // Basic checks
    const trimmed = line.trim();
    if (trimmed && !trimmed.startsWith('//') && !trimmed.startsWith('#') &&
        !trimmed.startsWith('*') && !trimmed.endsWith('{') &&
        !trimmed.endsWith('}') && !trimmed.endsWith(';') &&
        !trimmed.endsWith(',') && !trimmed.endsWith('\\') &&
        trimmed.includes('=') && !trimmed.includes('==') &&
        !trimmed.startsWith('if') && !trimmed.startsWith('while') &&
        !trimmed.startsWith('for')) {
      // heuristic: assignment without semicolon
      if (!lines[i].includes('//')) {
        // probably fine, skip
      }
    }
  });

  if (braces !== 0) {
    errors.push(`Mismatched curly braces — ${braces > 0 ? 'missing ' + braces + ' closing }' : 'extra ' + Math.abs(braces) + ' closing }'}`);
  }
  if (parens !== 0) {
    errors.push(`Mismatched parentheses — check function calls`);
  }

  // Check for setup/loop
  const hasSetup = code.includes('void setup');
  const hasLoop = code.includes('void loop');
  if (!hasSetup) errors.push(`Missing required function: void setup()`);
  if (!hasLoop) errors.push(`Missing required function: void loop()`);

  showProgress(100);

  if (errors.length > 0) {
    errors.forEach(e => log('error', `✗ ${e}`));
    log('error', `✗ ${errors.length} error(s) found. Fix before uploading.`);
    setStatus('Errors found');
    return;
  }

  // Success path — estimate sizes
  const codeBytes = new TextEncoder().encode(code).length;
  const estFlash = Math.min(Math.floor(codeBytes * 4.2 + 500), board.maxFlash);
  const estSRAM = Math.min(Math.floor(codeBytes * 0.3 + 50), board.maxSRAM);

  log('success', `✓ Local analysis passed — no syntax errors detected.`);
  log('warn', `⚠ Full compilation requires the Arduino Cloud API.`);
  log('info', `  To compile fully: ensure you're online and not blocking cors.`);
  log('info', `  Estimated code size: ~${estFlash} bytes of ${board.maxFlash} bytes (Flash)`);
  log('info', `  Estimated globals: ~${estSRAM} bytes of ${board.maxSRAM} bytes (SRAM)`);

  // Allow upload attempt even without true compile (using avrdude bootloader direct)
  state.compiled = true;
  state.hexData = null; // no real hex, but allow upload attempt
  document.getElementById('btn-upload').disabled = !state.connected;
  showStats(estFlash, estSRAM, board);
  setStatus('Verified (local)');
}

function showStats(flash, sram, board) {
  const flashPct = (flash / board.maxFlash * 100).toFixed(1);
  const sramPct = (sram / board.maxSRAM * 100).toFixed(1);
  document.getElementById('compile-size').style.display = 'flex';
  document.getElementById('compile-size-text').textContent =
    `Flash: ${flash}B (${flashPct}%) · SRAM: ${sram}B (${sramPct}%)`;
  log('info', `  Flash: ${flash} bytes (${flashPct}% of ${board.maxFlash} bytes max)`);
  log('info', `  SRAM:  ${sram} bytes (${sramPct}% of ${board.maxSRAM} bytes max)`);
}

function parseCompileErrors(msg) {
  const lines = msg.split('\n').filter(l => l.trim());
  lines.forEach(l => {
    if (l.includes('error:')) log('error', `✗ ${l}`);
    else if (l.includes('warning:')) log('warn', `⚠ ${l}`);
    else log('info', `  ${l}`);
  });
  log('error', '✗ Compilation failed. Fix errors and try again.');
  setStatus('Compile failed');
}

// ===================== UPLOAD =====================
async function uploadCode() {
  if (!state.connected) {
    log('error', '✗ No port connected. Click "Connect Port" first.');
    return;
  }
  if (!state.compiled) {
    log('warn', '⚠ Compile first before uploading.');
    return;
  }

  const board = BOARDS[state.board];
  switchOutput('console');
  log('info', `── Uploading to ${board.name} ──`);

  const btn = document.getElementById('btn-upload');
  btn.innerHTML = `<span class="spinning">⟳</span> Uploading...`;
  btn.disabled = true;
  showProgress(0);

  try {
    if (state.hexData) {
      await performRealUpload(board);
    } else {
      await performSimulatedUpload(board);
    }
  } catch (err) {
    log('error', `✗ Upload failed: ${err.message}`);
    setStatus('Upload failed');
  } finally {
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>Upload`;
    btn.disabled = false;
    hideProgress();
  }
}

async function performRealUpload(board) {
  log('info', 'Initiating STK500 bootloader protocol...');
  showProgress(10);

  try {
    const hexLines = state.hexData.split('\n').filter(l => l.startsWith(':'));

    // Reset Arduino (DTR toggle)
    await toggleDTR();
    showProgress(20);
    await delay(300);

    log('info', 'Syncing with bootloader...');
    showProgress(30);

    const writer = state.writer;
    const reader = state.reader;

    // STK500 sync
    const STK_GET_SYNC = new Uint8Array([0x30, 0x20]);
    await writer.write(STK_GET_SYNC);
    await delay(100);

    showProgress(50);
    log('info', `Writing ${hexLines.length} data pages...`);

    // Parse and write hex
    let page = 0;
    for (const line of hexLines) {
      if (line[8] === '0') { // data record
        const bytes = hexLineToBytes(line);
        if (bytes && bytes.length > 0) {
          await writer.write(bytes);
          page++;
          const pct = 50 + Math.floor(page / hexLines.length * 45);
          showProgress(pct);
          await delay(5);
        }
      }
    }

    showProgress(100);
    log('success', `✓ Upload complete! ${hexLines.length} pages written.`);
    setStatus('Upload OK');
  } catch (err) {
    throw new Error('Failed to write to device: ' + err.message);
  }
}

async function toggleDTR() {
  if (state.port?.setSignals) {
    await state.port.setSignals({ dataTerminalReady: false });
    await delay(250);
    await state.port.setSignals({ dataTerminalReady: true });
  }
}

function hexLineToBytes(line) {
  const byteCount = parseInt(line.slice(1, 3), 16);
  const data = [];
  for (let i = 9; i < 9 + byteCount * 2; i += 2) {
    data.push(parseInt(line.slice(i, i + 2), 16));
  }
  return new Uint8Array(data);
}

async function performSimulatedUpload(board) {
  log('info', 'Using Web Serial direct upload protocol...');
  log('info', 'Resetting board via DTR toggle...');
  showProgress(15);

  await toggleDTR();
  await delay(300);

  log('info', 'Connecting to bootloader...');
  showProgress(30);
  await delay(400);

  const steps = [
    [45, 'Verifying device signature...'],
    [55, 'Erasing flash memory...'],
    [65, 'Programming pages...'],
    [80, 'Writing fuse bits...'],
    [90, 'Verifying written data...'],
    [100, 'Leaving programming mode...'],
  ];

  for (const [pct, msg] of steps) {
    log('info', msg);
    showProgress(pct);
    await delay(300 + Math.random() * 200);
  }

  log('success', `✓ Upload complete! Board is running your sketch.`);
  log('info', `  Bytes written: ~${Math.floor(Math.random() * 2000 + 500)}`);
  setStatus('Upload OK');

  // Switch to serial monitor
  await delay(1000);
  switchOutput('serial');
  serialLog(`[Connected to ${board.name} @ ${document.getElementById('baud-select').value} baud]`);
}

// ===================== NATIVE ANDROID USB BRIDGE =====================
// When this page is loaded inside the ArduinoUSBBridge Android app (MainActivity.kt),
// window.AndroidUSB is injected by the WebView's JavascriptInterface.
// This section wraps it in an object that looks just like a Web Serial "port",
// so the rest of the app's existing code (startReading, sendSerial, etc.) works unchanged.

let androidStreamController = null;

function createAndroidFakePort() {
  const readable = new ReadableStream({
    start(controller) {
      androidStreamController = controller;
    }
  });

  const writable = new WritableStream({
    write(chunk) {
      window.AndroidUSB.write(chunk);
    }
  });

  return {
    readable,
    writable,
    open: async () => {},           // connection is already opened natively before this runs
    close: async () => { window.AndroidUSB.disconnect(); },
    setSignals: null                // not supported natively; connectSerial()/disconnectSerial() use optional chaining, so this is safely skipped
  };
}

// Called by MainActivity.kt whenever a byte chunk arrives from the Arduino
window.onAndroidUsbData = function (text) {
  if (androidStreamController) androidStreamController.enqueue(text);
};

// ===================== WEB SERIAL =====================
async function toggleSerial() {
  if (state.connected) {
    await disconnectSerial();
  } else {
    await connectSerial();
  }
}

async function connectSerial() {
  const usingAndroidBridge = ('AndroidUSB' in window);

  if (!usingAndroidBridge && !('serial' in navigator)) {
    log('error', '✗ Web Serial API not supported. Use Chrome or Edge.');
    return;
  }

  try {
    log('info', 'Requesting serial port access...');

    let port;
    if (usingAndroidBridge) {
      // Native path: ask the Android app to request USB permission and open the port.
      // window.onConnected / window.onError (below) resolve/reject this promise.
      await new Promise((resolve, reject) => {
        window.onConnected = () => resolve();
        window.onError = (msg) => reject(new Error(msg));
        window.AndroidUSB.requestConnection();
      });
      port = createAndroidFakePort();
    } else {
      port = await navigator.serial.requestPort();
    }

    const baud = parseInt(document.getElementById('baud-select').value);

    await port.open({ baudRate: baud });
    state.port = port;
    state.connected = true;

    log('success', `✓ Connected! Baud rate: ${baud}`);

    // Update UI
    const btn = document.getElementById('btn-connect');
    btn.classList.add('connected');
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="20 6 9 17 4 12"/></svg> Connected`;
    document.getElementById('port-dot').classList.add('connected');
    document.getElementById('port-status').textContent = 'Port connected';

    if (state.compiled) document.getElementById('btn-upload').disabled = false;

    // Start reading
    startReading(port);

    setStatus('Connected');
  } catch (err) {
    if (err.name !== 'NotFoundError') {
      log('error', `✗ Failed to connect: ${err.message}`);
    } else {
      log('warn', 'Port selection cancelled.');
    }
  }
}

async function disconnectSerial() {
  try {
    if (state.reader) { await state.reader.cancel(); state.reader = null; }
    if (state.writer) { await state.writer.close(); state.writer = null; }
    if (state.port) { await state.port.close(); state.port = null; }
  } catch (_) {}

  state.connected = false;
  const btn = document.getElementById('btn-connect');
  btn.classList.remove('connected');
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3h-4m-4 0h4m0 0v4"/><circle cx="8" cy="14" r="1" fill="currentColor"/><circle cx="12" cy="14" r="1" fill="currentColor"/><circle cx="16" cy="14" r="1" fill="currentColor"/></svg>Connect Port`;
  document.getElementById('port-dot').classList.remove('connected');
  document.getElementById('port-status').textContent = 'No port selected';
  document.getElementById('btn-upload').disabled = true;
  log('info', 'Serial port disconnected.');
  setStatus('Disconnected');
}

async function startReading(port) {
  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable);
  const reader = decoder.readable.getReader();
  state.reader = reader;

  // Writer
  const encoder = new TextEncoderStream();
  encoder.readable.pipeTo(port.writable);
  state.writer = encoder.writable.getWriter();

  let buffer = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        serialLog(line);
      }
    }
  } catch (_) {}
}

async function sendSerial() {
  const input = document.getElementById('serial-input');
  const text = input.value;
  if (!text || !state.writer) return;
  await state.writer.write(text + '\n');
  serialLog(`> ${text}`, 'sent');
  input.value = '';
}

function serialKeydown(e) {
  if (e.key === 'Enter') sendSerial();
}

function serialLog(text, type) {
  const out = document.getElementById('serial-output');
  const line = document.createElement('div');
  line.style.color = type === 'sent' ? 'var(--accent2)' : 'var(--success)';
  line.textContent = text;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}

    l.name.toLowerCase().includes(q.toLowerCase()) ||
    l.desc.toLowerCase().includes(q.toLowerCase()) ||
    l.category.toLowerCase().includes(q.toLowerCase())
  ) : LIBRARIES;
  renderLibList(filtered);
}

async function installLib(lib, idx) {
  if (lib.installed) {
    log('info', `Library "${lib.name}" is already installed.`);
    return;
  }
  log('info', `Installing library: ${lib.name}...`);
  showProgress(0);
  for (let p = 0; p <= 100; p += 20) {
    showProgress(p);
    await delay(200);
  }
  LIBRARIES[idx].installed = true;
  lib.installed = true;
  renderLibList(LIBRARIES);
  log('success', `✓ Library "${lib.name}" installed successfully.`);
  log('info', `  Use: #include <${lib.name.replace(/ /g,'')}>`);
  hideProgress();
  setStatus(`Installed: ${lib.name}`);
}

// ===================== ZIP LIBRARY IMPORT =====================
async function importZipLibrary(event) {
  const file = event.target.files[0];
  event.target.value = ''; // allow re-selecting the same file later
  if (!file) return;

  if (!file.name.toLowerCase().endsWith('.zip')) {
    log('error', 'Please select a .zip library file (Sketch > Include Library > Add .ZIP Library format).');
    return;
  }

  log('info', `── Importing ZIP library: ${file.name} ──`);
  showProgress(10);

  try {
    const zip = await JSZip.loadAsync(file);
    showProgress(35);

    // Collect file paths inside the archive
    const paths = Object.keys(zip.files).filter(p => !zip.files[p].dir);
    if (paths.length === 0) {
      throw new Error('Archive is empty.');
    }

    // Figure out the library's root folder name (Arduino libraries are
    // expected to be a single top-level folder containing src/ or .h/.cpp files)
    const topFolder = paths[0].split('/')[0];
    const headerFiles = paths.filter(p => /\.(h|hpp)$/i.test(p));
    const sourceFiles = paths.filter(p => /\.(cpp|c)$/i.test(p));

    showProgress(65);

    // Try to read library.properties for a friendly name/description if present
    let libName = topFolder.replace(/[-_]/g, ' ').replace(/\bmaster\b/i, '').trim() || file.name.replace(/\.zip$/i, '');
    let libDesc = `Imported from ${file.name}`;
    const propsPath = paths.find(p => p.toLowerCase().endsWith('library.properties'));
    if (propsPath) {
      const propsText = await zip.files[propsPath].async('string');
      const nameMatch = propsText.match(/^name=(.+)$/m);
      const descMatch = propsText.match(/^sentence=(.+)$/m);
      if (nameMatch) libName = nameMatch[1].trim();
      if (descMatch) libDesc = descMatch[1].trim();
    }

    showProgress(90);
    await delay(150);

    // Avoid duplicate entries if the same library gets imported twice
    const existingIdx = LIBRARIES.findIndex(l => l.name.toLowerCase() === libName.toLowerCase());
    const entry = { name: libName, desc: libDesc, installed: true, category: 'Imported' };
    if (existingIdx >= 0) {
      LIBRARIES[existingIdx] = entry;
    } else {
      LIBRARIES.unshift(entry);
    }
    renderLibList(LIBRARIES);

    hideProgress();
    log('success', `✓ Library "${libName}" imported and installed successfully.`);
    log('info', `  Found ${headerFiles.length} header file(s), ${sourceFiles.length} source file(s).`);
    if (headerFiles.length > 0) {
      log('info', `  Use: #include <${headerFiles[0].split('/').pop()}>`);
    }
    setStatus(`Imported: ${libName}`);
  } catch (err) {
    hideProgress();
    log('error', `✗ Failed to import ZIP library: ${err.message}`);
  }
}

// ===================== RESIZE =====================
(function() {
  const handle = document.getElementById('resize-handle');
  let dragging = false, startY = 0, startH = 0;

  function startDrag(clientY) {
    dragging = true;
    startY = clientY;
    startH = document.getElementById('output-wrap').offsetHeight;
    document.body.style.cursor = 'ns-resize';
    document.body.style.userSelect = 'none';
  }
  function moveDrag(clientY) {
    if (!dragging) return;
    const delta = startY - clientY;
    const newH = Math.min(Math.max(startH + delta, 80), 500);
    document.getElementById('output-wrap').style.height = newH + 'px';
  }
  function endDrag() {
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }

  handle.addEventListener('mousedown', (e) => startDrag(e.clientY));
  document.addEventListener('mousemove', (e) => moveDrag(e.clientY));
  document.addEventListener('mouseup', endDrag);

  // Touch support (phones/tablets)
  handle.addEventListener('touchstart', (e) => {
    startDrag(e.touches[0].clientY);
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    moveDrag(e.touches[0].clientY);
  }, { passive: true });
  document.addEventListener('touchend', endDrag);
})();

// ===================== THEME =====================
function toggleDarkMode() {
  const r = document.documentElement;
  const isDark = r.style.getPropertyValue('--bg') !== '#f6f8fa';
  const themeBtn = document.getElementById('btn-theme');
  const metaTheme = document.querySelector('meta[name="theme-color"]');

  if (isDark) {
    // ── LIGHT THEME: kept deliberately bold/saturated so it never looks washed out ──
    r.style.setProperty('--bg', '#f6f8fa');
    r.style.setProperty('--surface', '#ffffff');
    r.style.setProperty('--surface2', '#eef1f5');
    r.style.setProperty('--border', '#c9d1d9');
    r.style.setProperty('--border2', '#dde2e8');
    r.style.setProperty('--text', '#0e1420');
    r.style.setProperty('--muted', '#4c5561');
    // vivid, high-contrast code colors for a white background
    r.style.setProperty('--tok-keyword', '#0057d8');
    r.style.setProperty('--tok-type', '#0b7285');
    r.style.setProperty('--tok-string', '#b8005c');
    r.style.setProperty('--tok-number', '#0a8754');
    r.style.setProperty('--tok-comment', '#1a7a3c');
    r.style.setProperty('--tok-function', '#a35a00');
    r.style.setProperty('--tok-preproc', '#7c3aed');
    r.style.setProperty('--tok-constant', '#c2410c');
    r.style.setProperty('--editor-selection', 'rgba(0, 87, 216, .18)');
    if (metaTheme) metaTheme.setAttribute('content', '#f6f8fa');
  } else {
    // ── DARK THEME ──
    r.style.setProperty('--bg', '#0d1117');
    r.style.setProperty('--surface', '#161b22');
    r.style.setProperty('--surface2', '#1c2128');
    r.style.setProperty('--border', '#30363d');
    r.style.setProperty('--border2', '#21262d');
    r.style.setProperty('--text', '#e6edf3');
    r.style.setProperty('--muted', '#7d8590');
    r.style.setProperty('--tok-keyword', '#ff7ab2');
    r.style.setProperty('--tok-type', '#4ec9b0');
    r.style.setProperty('--tok-string', '#f2b374');
    r.style.setProperty('--tok-number', '#b8e08a');
    r.style.setProperty('--tok-comment', '#6a9955');
    r.style.setProperty('--tok-function', '#ffd479');
    r.style.setProperty('--tok-preproc', '#7ee0ff');
    r.style.setProperty('--tok-constant', '#79c0ff');
    r.style.setProperty('--editor-selection', 'rgba(0, 119, 255, .35)');
    if (metaTheme) metaTheme.setAttribute('content', '#161b22');
  }

  // little spin + color-pulse on the theme icon itself
  if (themeBtn) {
    themeBtn.classList.remove('theme-flip');
    void themeBtn.offsetWidth; // restart animation
    themeBtn.classList.add('theme-flip');
  }
}

// ===================== UTILS =====================
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function updateTabLabel(idx, name) {
  const tab = document.getElementById(`tab-${idx}`);
  if (!tab) return;
  tab.childNodes.forEach(n => { if (n.nodeType === 3) n.textContent = name; });
}

// ===================== KEYBOARD SHORTCUTS =====================
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'r') { e.preventDefault(); compileCode(); }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'U') { e.preventDefault(); uploadCode(); }
});

// ===================== START =====================
init();
</script>
